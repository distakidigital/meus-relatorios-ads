name: Gerar Relatorios Looker Studio

on:
  schedule:
    - cron: '0 11 * * *' # Roda todo dia às 08:00 (Brasília = UTC-3)
  workflow_dispatch: # Permite rodar manualmente no botão

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          pip install playwright
          playwright install chromium

      - name: Executar Script de Captura
        run: |
          python generate_reports.py

      - name: Commit e Push dos Relatórios Gerados
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática de relatórios" && git push)
